name: Noget virker ikke
description: Fortæl om en fejl i Ordhjælp
title: "Fejl: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Tak, fordi du hjælper med at gøre Ordhjælp bedre.
        Skriv ikke navne eller andre personlige oplysninger. Alt her kan ses af alle.
  - type: textarea
    id: hvad
    attributes:
      label: Hvad skete der?
      description: Beskriv med dine egne ord, hvad der gik galt.
    validations:
      required: true
  - type: textarea
    id: forventet
    attributes:
      label: Hvad havde du regnet med?
    validations:
      required: false
  - type: textarea
    id: hvordan
    attributes:
      label: Hvordan kan vi få det til at ske igen?
      description: Fx "Jeg markerede tekst i Word og trykkede på Læs op."
    validations:
      required: false
  - type: textarea
    id: teknisk
    attributes:
      label: Tekniske oplysninger
      description: Ordhjælp har udfyldt dette. Du behøver ikke ændre noget.
      render: text
    validations:
      required: false
