name: Tests

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Systempakker
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 \
            libportaudio2 hunspell hunspell-da at-spi2-core xvfb xdotool dbus-x11 \
            python3-gi gir1.2-gtk-3.0
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Læs under musen mod rigtig AT-SPI
        run: uv run pytest -q tests/integration/test_atspi.py
        env:
          ORDHJAELP_ATSPI_TEST: "1"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"
