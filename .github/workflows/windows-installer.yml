name: Windows-installer

# Bygger dist/Ordhjaelp-<version>-Setup.exe og dist/Ordhjaelp-<version>-Windows.zip.
# - Ved en tag som v0.3.0 lægges begge på GitHub-udgivelsen.
# - Ellers kan den hentes under "Artifacts" på workflow-kørslen.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "packaging/windows/**"
      - ".github/workflows/windows-installer.yml"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # til at lægge installeren på udgivelsen

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - run: uv sync --group windows-build
      - name: Byg installeren
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File packaging\windows\build-installer.ps1
      - name: Afprøv installeren (stille installation uden administrator)
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\Ordhjaelp-*-Setup.exe | Select-Object -First 1
          $proc = Start-Process $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/TASKS=" -PassThru -Wait
          if ($proc.ExitCode -ne 0) { throw "Installationen fejlede ($($proc.ExitCode))" }
          $exe = "$env:LOCALAPPDATA\Programs\Ordhjaelp\Ordhjaelp.exe"
          if (-not (Test-Path $exe)) { throw "Ordhjaelp.exe blev ikke installeret i brugerens mappe" }
          foreach ($tool in "hunspell\hunspell.exe", "tesseract\tesseract.exe") {
            if (-not (Test-Path "$env:LOCALAPPDATA\Programs\Ordhjaelp\tools\$tool")) { throw "$tool mangler" }
          }
          $proc = Start-Process $exe -ArgumentList "--help" -PassThru -Wait
          if ($proc.ExitCode -ne 0) { throw "Ordhjaelp.exe --help fejlede" }
          $uninstall = "$env:LOCALAPPDATA\Programs\Ordhjaelp\unins000.exe"
          Start-Process $uninstall -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES" -Wait
      - name: Afprøv zip-filen (pak ud og kør)
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist\Ordhjaelp-*-Windows.zip | Select-Object -First 1
          $dest = Join-Path $env:RUNNER_TEMP "zip-test"
          Expand-Archive $zip.FullName -DestinationPath $dest
          $exe = Join-Path $dest "Ordhjaelp\Ordhjaelp.exe"
          foreach ($file in "Ordhjaelp.exe", "LAES-MIG.txt", "tools\hunspell\hunspell.exe", "tools\tesseract\tesseract.exe") {
            if (-not (Test-Path (Join-Path $dest "Ordhjaelp\$file"))) { throw "$file mangler i zip-filen" }
          }
          $proc = Start-Process $exe -ArgumentList "--help" -PassThru -Wait
          if ($proc.ExitCode -ne 0) { throw "Ordhjaelp.exe fra zip-filen fejlede" }
      - uses: actions/upload-artifact@v4
        with:
          name: Ordhjaelp-Setup
          path: dist/Ordhjaelp-*-Setup.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Ordhjaelp-Windows-zip
          path: dist/Ordhjaelp-*-Windows.zip
          if-no-files-found: error
          compression-level: 0 # er allerede pakket
      - name: Læg installeren og zip-filen på udgivelsen
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = (Get-ChildItem dist\Ordhjaelp-*-Setup.exe, dist\Ordhjaelp-*-Windows.zip).FullName
          gh release view $env:GITHUB_REF_NAME 2>$null
          if ($LASTEXITCODE) { gh release create $env:GITHUB_REF_NAME --title "Ordhjælp $env:GITHUB_REF_NAME" --generate-notes }
          gh release upload $env:GITHUB_REF_NAME @files --clobber
