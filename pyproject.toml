[project]
name = "ordhjaelp"
version = "0.1.0"
description = "Dansk læse- og skrivehjælp (LST) – oplæsning, diktering og ordforslag"
readme = "README.md"
authors = [
    { name = "Ole Frandsen", email = "froksen@gmail.com" }
]
requires-python = ">=3.12,<3.14"
license = "GPL-3.0-or-later"
dependencies = [
    "dbus-fast>=5.2.0",
    "faster-whisper>=1.2.1",
    "numpy>=2.5.5",
    "piper-tts>=1.8.0",
    "platformdirs>=4.14.8",
    "pyside6-essentials>=6.12.0",
    "sounddevice>=0.5.6",
]

[project.scripts]
ordhjaelp = "ordhjaelp.cli:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
